# Render (https://render.com) — one-click deploy, ONE Docker service:
# Fastify serves the API (/v1/*), the built Mini App (static) and the bot.
# Secrets marked `sync: false` are filled in the Render dashboard (env tab).
services:
  - type: web
    name: delis-tg-admin
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # ── обязательные (панель Render → Environment) ──
      - key: TG_BOT_TOKEN        # от @BotFather
        sync: false
      - key: BROWSER_SESSION_SECRET # openssl rand -hex 32; optional, TG_BOT_TOKEN is fallback
        sync: false
      - key: ADMIN_CHAT_ID       # твой ID от @userinfobot
        sync: false
      - key: SUPABASE_URL        # supabase.com → Project URL
        sync: false
      - key: SUPABASE_SERVICE_KEY # Settings → API → service_role
        sync: false
      # после первого деплоя задай = https://delis-app.onrender.com
      - key: APP_URL
        sync: false
      # ── опциональные ──
      - key: BOT_USERNAME         # имя бота без @ (для реф-ссылок)
        sync: false
      - key: COURIER_CHAT_IDS     # ID курьеров через запятую
        sync: false
      - key: STAFF_TG_USER_IDS    # ОБЯЗАТЕЛЬНО при групповом ADMIN_CHAT_ID: user-id сотрудников через запятую
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: SUPPORT_PHONE_2
        sync: false
      - key: SUPPORT_MANAGER_TG
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET
        sync: false
      - key: PUBLIC_API_URL       # origin API (для вебхуков Payme/Click в админке), без / в конце
        sync: false
      # ── новые (сентябрь 2026), значения по умолчанию см. .env.example ──
      - key: TG_MONEY_INIT_DATA_MAX_AGE_SECONDS  # окно сессии checkout (default 900)
        sync: false
      - key: BACKUP_UPLOAD_SECONDS                # период бэкапа БД в Supabase (default 300)
        sync: false
      - key: CORS_EXTRA_ORIGINS                   # точные доп. CORS origin'ы через запятую
        sync: false
      # ── значения по умолчанию ──
      - key: SEED_ON_START
        value: "true"
      - key: ENABLE_SEEDED_PROMOS
        value: "false"
      - key: TZ
        value: Asia/Tashkent
      - key: REPORT_HOUR
        value: "18"
      - key: BACKUP_HOUR
        value: "3"
